# ============================================================
# Render Blueprint — Drinks Quick Backend
# Reference: https://render.com/docs/blueprint-spec
#
# HOW TO USE (one-time, ~2 min):
#   1. Put this repo into a GitHub repo (or connect Render to it).
#   2. Render Dashboard → "New" → "Blueprint" → connect your repo.
#   3. Render reads this file, creates the service, and prompts for
#      the env var values below (DATABASE_URL, ADMIN_PASSWORD, ...).
#   4. Add GROQ_API_KEY if you want the AI chat assistant.
#
# NOTE: There is also an existing service on Render
# (drink-quick-cal-kja1). You can either:
#   - use this blueprint to create a NEW service, or
#   - open the existing service → Settings → and set the new
#     env vars there (no blueprint needed).
# ============================================================

services:
  - type: web
    name: drink-quick-backend
    runtime: node
    plan: free
    rootDir: drinks-calculator-backend
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/ping
    envVars:
      - key: DATABASE_URL
        sync: false # you'll paste the Supabase connection string at create time
      - key: ADMIN_PASSWORD
        sync: false # strong, unique admin password
      - key: GROQ_API_KEY
        sync: false # optional — leave blank to disable AI chat