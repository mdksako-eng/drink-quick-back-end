# ============================================================
# Render Blueprint — Drinks Quick Backend
# Reference: https://render.com/docs/blueprint-spec
#
# HOW TO USE (one-time, ~2 min):
#   1. Put this repo into a GitHub repo (or connect Render to it).
#   2. Render Dashboard → "New" → "Blueprint" → connect your repo.
#   3. Render reads this file, creates the service, and prompts for
#      the env var values below (DATABASE_URL, ADMIN_PASSWORD, ...).
#   4. Add GROQ_API_KEY if you want the AI chat assistant.
#
# NOTE: There is also an existing service on Render
# (drink-quick-cal-kja1). You can either:
#   - use this blueprint to create a NEW service, or
#   - open the existing service → Settings → and set the new
#     env vars there (no blueprint needed).
# ============================================================

services:
  - type: web
    name: drink-quick-backend
    runtime: node
    plan: free
    rootDir: drinks-calculator-backend
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/ping
    envVars:
      - key: DATABASE_URL
        sync: false # you'll paste the Supabase connection string at create time
      - key: ADMIN_PASSWORD
        sync: false # strong, unique admin password
      - key: GROQ_API_KEY
        sync: false # optional — leave blank to disable AI chat
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false # Flutterwave secret key (card payments)
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false # Flutterwave public key
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        sync: false # random secret for webhook signature verification
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false # random secret for MoMo payment webhook verification
      - key: STARTER_PRICE_XAF
        sync: false # optional — default 5000
      - key: PRO_PRICE_XAF
        sync: false # optional — default 15000
      # Platform (YOUR) Mobile Money — subscription payments go to these.
      - key: PLATFORM_MTN_PHONE
        sync: false # your MTN MoMo number (manual mode — works without API keys)
      - key: PLATFORM_ORANGE_PHONE
        sync: false # your Orange Money number (manual mode)
      - key: PLATFORM_MTN_MERCHANT_ID
        sync: false # optional — MTN API user (X-Reference-Id) for auto mode
      - key: PLATFORM_MTN_API_KEY
        sync: false # optional — MTN API key for auto mode
      - key: PLATFORM_MTN_SECRET_KEY
        sync: false # optional — MTN subscription key for auto mode
      - key: PLATFORM_MTN_SANDBOX
        sync: false # optional — true while testing (default), false for live
      - key: PLATFORM_ORANGE_MERCHANT_ID
        sync: false # optional — Orange merchant key for auto mode
      - key: PLATFORM_ORANGE_API_KEY
        sync: false # optional — Orange client_id for auto mode
      - key: PLATFORM_ORANGE_SECRET_KEY
        sync: false # optional — Orange client_secret for auto mode