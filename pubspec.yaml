name: drinks_calculator_fixed
description: "A professional drinks ordering and management app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^5.0.2  

  provider: ^6.1.2
  supabase_flutter: ^2.1.3
  intl: ^0.19.0
  sizer: ^2.0.15
  printing: ^5.13.1
  pdf: ^3.10.7
  path_provider: ^2.1.2
  share_plus: ^12.0.1
  shared_preferences: ^2.2.3
  permission_handler: ^11.1.0
  fluttertoast: ^8.2.0
  excel: ^2.0.0
  http: ^1.1.0
  open_file: ^3.3.0
  #Security dependencies (WhatsApp-level)
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.7
  device_info_plus: ^9.1.1
  crypto: ^3.0.3
  encrypt: ^5.0.3
  #UI dependencies
  url_launcher: ^6.2.1
  image_picker: ^1.0.4
  csv: ^5.1.1
  flutter_tts: ^4.0.0
  speech_to_text: ^7.2.0
  flutter_local_notifications: ^17.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#667EEA"

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/icon.png
